# Configuration for bulk creating nested stock locations with location types
# 
# This creates a hierarchy:
#   R01 / L01 / B01-B20
#   R01 / L02 / B01-B20
#   ...
#   R09 / L06 / B01-B20

# Create 30 simple sublocations BX031-BX060 under Temp
racks: 30
rack_offset: 30
shelves_per_rack: 0
boxes_per_shelf: 0

location_types:
  rack: "Box"
  shelf: null
  box: null

naming_pattern:
  rack: "BX{i:03d}"
  shelf: "dummy"
  box: "dummy"
