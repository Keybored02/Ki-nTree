[tool.poetry]
name = "kintree"
version = "1.2.1" # placeholder
description = "Fast part creation in KiCad and InvenTree"
authors = ["eeintech <eeintech@eeinte.ch>"]
maintainers = ["eeintech <eeintech@eeinte.ch>"]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/sparkmicro/Ki-nTree"
repository = "https://github.com/sparkmicro/Ki-nTree"
keywords = ["inventree", "kicad", "digikey", "mouser", "component", "part", "create"]

[tool.poetry.dependencies]
python = ">=3.9,<3.14"
digikey-apiv4 = "^1.0.0"
setuptools = "^75.6.0"
flet = "0.24.1"
thefuzz = "^0.22.1"
inventree = "^0.23.1"
kiutils = "^1.4.8"
mouser = "^0.1.6"
multiprocess = "^0.70.17"
pyyaml = "^6.0.2"
validators = "^0.34.0"
wrapt_timeout_decorator = "^1.5.1"
cloudscraper = "^1.2.71"
playwright = "^1.51.0"
openpyxl = "^3.1.5"

[tool.poetry.dev-dependencies]
invoke = "^2.0.0"
coveralls = "^3.3.1"

[tool.poetry.scripts]
kintree = 'kintree.kintree_gui:main'
kintree_setup_inventree = 'kintree.setup_inventree:setup_inventree'

[tool.ruff]
# Impostazioni generali (versioni, file inclusi/esclusi)
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "bulk"
]

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E722",   # bare except
    "B007",   # loop variable not used
    "B904",   # raise from inside except
]
# Only auto-fix safe, non-destructive rules. Never auto-fix import ordering
# (I) as it can break deliberate sys.modules manipulation in test files.
fixable = ["E", "W", "F401"]
unfixable = ["B", "F8"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports in test shim files are intentional

[tool.ruff.format]
# Usa virgolette doppie: è lo standard Python (PEP 8) e riduce i diff.
quote-style = "double"

# Indentazione con spazi per consistenza tra diversi editor.
indent-style = "space"

# Inserisce una virgola finale automatica in liste/tuple multi-riga.
# Fondamentale per pulire i diff di Git quando si aggiungono elementi.
skip-magic-trailing-comma = false

# Format della docstring: rende leggibili gli esempi di codice nei commenti.
docstring-code-format = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert — fine in tests
    "B110",  # try/except/pass — intentional silent-failure pattern in download helpers
    "B112",  # try/except/continue — intentional in download loops
    "B311",  # random — not used for cryptography
    "B310",  # urllib.urlopen — URLs are validated upstream before being passed
    "B113",  # requests without timeout — socket.setdefaulttimeout() covers this
    "B105",  # hardcoded password string — false positive on empty defaults and URL constants
    "B107",  # hardcoded password default — false positive on password='' function defaults
]

[build-system]
requires = ["poetry-core>=1.4.2"]
build-backend = "poetry.core.masonry.api"
